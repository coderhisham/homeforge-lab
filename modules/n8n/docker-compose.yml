# modules/n8n/docker-compose.yml
# n8n for tuninforge — workflow automation.
#
# Dependencies (auto-selected by the menu's dependency check): Postgres (stores
# all workflows + encrypted credentials — the real persistence) and Redis (wired
# for queue mode; see docs/n8n.md). The connection secrets are NOT duplicated
# here: modules/n8n/setup.sh reads Postgres's and Redis's generated passwords via
# tuninforge_get_env and writes them into modules/n8n/.env before this starts, and it
# ensures the 'n8n' database exists in the already-running Postgres.
#
# Networking: BOTH networks. tuninforge_internal to reach postgres/redis privately;
# tuninforge_public so Caddy fronts the UI at a *.ts.net name. No ports published.
#
# ⚠ N8N_ENCRYPTION_KEY is critical: it encrypts stored credentials. If it is
# lost or changed, existing saved credentials become unreadable. It is generated
# once into .env and shown once — back it up like any other secret.

services:
  n8n:
    image: n8nio/n8n:1.118.1   # pinned for reproducibility (stable line; "latest" is not stable per n8n)
    container_name: tuninforge_n8n
    restart: unless-stopped
    environment:
      # --- Database (Postgres) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "${N8N_DB_NAME:-n8n}"
      DB_POSTGRESDB_USER: "${N8N_DB_USER:-tuninforge}"
      DB_POSTGRESDB_PASSWORD: "${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set (setup.sh fills it from Postgres)}"
      # --- Credential encryption (critical — see note above) ---
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set (see .env)}"
      # --- Web / proxy behind Caddy ---
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-https}"
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-}"
      N8N_PROXY_HOPS: "1"
      # --- Redis connection (ready for queue mode; regular mode by default) ---
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_PASSWORD: "${N8N_REDIS_PASSWORD:-}"
      GENERIC_TIMEZONE: "${N8N_TIMEZONE:-UTC}"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tuninforge_internal
      - tuninforge_public
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      # n8n serves /healthz on 5678. Node image tooling varies, so healthcheck.sh
      # probes from a curl container; this in-image check is best-effort.
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  n8n_data:
    name: tuninforge_n8n_data

networks:
  tuninforge_internal:
    external: true
    name: tuninforge_internal
  tuninforge_public:
    external: true
    name: tuninforge_public
