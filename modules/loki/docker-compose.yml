# modules/loki/docker-compose.yml
# Loki for tuninforge — log aggregation (the "Prometheus for logs").
#
# Storage: filesystem (local volume) — the simplest, dependency-free setup for a
# single homelab box. No S3/object store needed. Logs are pushed here by
# Grafana Alloy and queried in Grafana.
#
# Networking: tuninforge_internal — Alloy ships to it and Grafana reads it, both
# privately. Not Caddy-fronted (no public UI; you view logs through Grafana).
#
# Stateful (log store grows): NO watchtower label — update deliberately.

services:
  loki:
    image: grafana/loki:3.5.0   # VM-confirmed pull (2026)
    container_name: tuninforge_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - tuninforge_internal
    # No in-container healthcheck: the loki image is distroless (no shell/wget).
    # tuninforge liveness fallback + healthcheck.sh (curl-container /ready probe)
    # verify it.

volumes:
  loki_data:
    name: tuninforge_loki_data

networks:
  tuninforge_internal:
    external: true
    name: tuninforge_internal
