# modules/loki/loki-config.yaml — single-binary, filesystem storage.
# Minimal config suited to one homelab box. No object store, no clustering.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retention period (edit here). Loki does NOT expand ${ENV} in its config
  # unless started with -config.expand-env=true, so this is a literal value.
  retention_period: 168h   # 7 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Silence the "analytics" phone-home.
analytics:
  reporting_enabled: false
