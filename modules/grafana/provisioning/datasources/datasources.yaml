# modules/grafana/provisioning/datasources/datasources.yaml
# Auto-provisioned datasources — added at Grafana startup, no manual setup.
# Prometheus (metrics) and Loki (logs) are reached over tuninforge_internal.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: tuninforge-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: tuninforge-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
