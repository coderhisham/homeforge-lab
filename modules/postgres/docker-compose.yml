# modules/postgres/docker-compose.yml
# PostgreSQL for homelab-forge — the shared relational database.
#
# Isolation: joins ONLY forge_internal (an --internal network with no outbound/
# gateway), so it is reachable by other stack services that also join that
# network, never from the public/tailnet side. It is deliberately NOT on
# forge_public and publishes NO ports.
#
# Stateful: NO watchtower label — databases are never auto-updated (a bad
# upgrade can corrupt data). Update deliberately, after a backup.
#
# Multi-database: POSTGRES_MULTIPLE_DATABASES (comma-separated) is read by the
# init script to create additional databases on first boot (e.g. n8n, litellm).

services:
  postgres:
    image: postgres:18-alpine
    container_name: forge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-forge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env)}"
      POSTGRES_DB: "${POSTGRES_DB:-forge}"
      POSTGRES_MULTIPLE_DATABASES: "${POSTGRES_MULTIPLE_DATABASES:-}"
      # Keep initdb deterministic across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First-boot database creation. Runs only when the data dir is empty.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - forge_internal
    healthcheck:
      # pg_isready ships with the postgres image — no external tools needed.
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-forge}\" -d \"${POSTGRES_DB:-forge}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: forge_postgres_data

networks:
  forge_internal:
    external: true
    name: forge_internal
