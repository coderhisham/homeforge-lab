# modules/redis/docker-compose.yml
# Redis for tuninforge — in-memory cache / queue.
#
# Isolation: tuninforge_internal ONLY (no public exposure, no published ports).
# Auth: requirepass is set from REDIS_PASSWORD; clients must AUTH.
# Persistence: appendonly on, so a restart doesn't lose queued data.
# Stateful: NO watchtower label — update deliberately after a backup.

services:
  redis:
    image: redis:8-alpine
    container_name: tuninforge_redis
    restart: unless-stopped
    # Password comes from the environment; --requirepass wires it into the server.
    # Using sh -c so the env var expands inside the container at start.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env)}"
    volumes:
      - redis_data:/data
    networks:
      - tuninforge_internal
    healthcheck:
      # redis-cli ships in the image. AUTH via env, then PING must return PONG.
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    name: tuninforge_redis_data

networks:
  tuninforge_internal:
    external: true
    name: tuninforge_internal
