# modules/minio/docker-compose.yml
# MinIO for tuninforge — S3-compatible object storage.
#
# Networking: BOTH networks. tuninforge_internal so in-cluster services can use it as
# an S3 endpoint (http://minio:9000) with no public exposure; tuninforge_public so
# Caddy can front the web console at a *.ts.net name. No ports are published
# directly — access is via Caddy (tailnet-only) or the internal network.
#
# Stateful: NO watchtower label — object data must not be risked by auto-update.
#
# ⚠ VERIFY ON VM (two things I could not confirm without the box):
#   1. Image tag: MinIO uses date-stamped RELEASE tags. The tag below is pinned
#      from training knowledge; if `pull` fails, bump it to a current release
#      (https://hub.docker.com/r/minio/minio/tags). Failure is loud, not silent.
#   2. Healthcheck: uses `mc ready local` — MinIO's documented healthcheck; `mc`
#      ships in the server image. If your image lacks it, tuninforge's liveness
#      fallback (running+stable) still verifies the container, and
#      healthcheck.sh probes the HTTP health endpoint from the host.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # minio/minio (docker.io) archived Apr 2026 — this is the last VM-validated community tag; the RELEASE line is effectively frozen. New dev moved to AIStor (dl.min.io); evaluate a maintained image/fork before bumping.
    container_name: tuninforge_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set (see .env)}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set (see .env)}"
      # Tell MinIO its browser-facing URL so console redirects work behind Caddy.
      MINIO_BROWSER_REDIRECT_URL: "${MINIO_CONSOLE_URL:-}"
    volumes:
      - minio_data:/data
    networks:
      - tuninforge_internal
      - tuninforge_public
    healthcheck:
      # MinIO's documented healthcheck. See the VERIFY note above.
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  minio_data:
    name: tuninforge_minio_data

networks:
  tuninforge_internal:
    external: true
    name: tuninforge_internal
  tuninforge_public:
    external: true
    name: tuninforge_public
